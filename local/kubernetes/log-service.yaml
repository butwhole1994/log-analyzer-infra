apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-service
  labels:
    app.kubernetes.io/name: log-service
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: log-analyzer
spec:
  replicas: 1
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 180
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: log-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: log-service
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: log-analyzer
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: log-service
          image: log-analyzer/log-service:local
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: log-service-config
            - secretRef:
                name: backend-database
          ports:
            - name: http
              containerPort: 7020
              protocol: TCP
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 45
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 640Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: log-service
  labels:
    app.kubernetes.io/name: log-service
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: log-analyzer
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: log-service
  ports:
    - name: http
      port: 7020
      targetPort: http
      protocol: TCP
